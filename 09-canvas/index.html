<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #222; color: #fff; font-family: sans-serif; padding: 16px; }
    canvas { background: #111; border: 1px solid #555; display: block; margin: 12px 0; }
    button { cursor: pointer; padding: 6px 12px; margin-right: 6px; }
  </style>
</head>

<body>
  <canvas id="canvas" width="400" height="300"></canvas>

  <button id="roll">굴리기</button>
  <button id="tilt">기울이기</button>
</body>
<script src="../lib.js"></script>
<script>
  // ============ 09 - canvas (2회차) ============
  const ctx = canvas.getContext('2d')
  const w = canvas.width
  const h = canvas.height

  /* ============================================================
     미션 B : 주사위
     ============================================================

     최종 목표 — 굴리기를 누르면 주사위 두 개가 바뀌고 합계가 나오는 화면.

     ------------------------------------------------------------
     STEP 1 — 판 그리기
     ------------------------------------------------------------
     · 가운데에 흰색 정사각형 하나. 한 변 120.
     · 숫자를 직접 쓰지 말고 w, h 로 계산하세요.

     ------------------------------------------------------------
     STEP 2 — 3x3 격자
     ------------------------------------------------------------
     주사위 눈은 3x3 격자 중 몇 칸에 점을 찍느냐로 정해집니다.

           0   1   2      <- 칸 번호(col)
        0  ·   ·   ·
        1  ·   ·   ·
        2  ·   ·   ·
        ^ row

     · 판 안에 검은 점 9개를 전부 찍으세요. 반지름 10.
     · col, row (0~2) 를 넣으면 화면 좌표가 나오는 계산을 세우세요.
       판의 왼쪽 위 모서리 좌표와 칸 간격부터 정하면 됩니다.

     확인:  점 9개가 판 안에 고르게 들어가야 합니다.
            판 밖으로 나가거나 모서리에 딱 붙으면 간격 계산이 틀린 겁니다.

     ------------------------------------------------------------
     STEP 3 — ⭐ 함정 : 지우지 않으면
     ------------------------------------------------------------
     · 점 9개를 그린 "뒤에", 같은 자리에 점 1개(정중앙)만 다시 그리세요.
     · 지우지 않고 그냥 그립니다.

       예상 (화면에 점이 몇 개 보일까요):
       실제:
       왜 그런지:

     · DOM 이었다면 어땠을지도 한 줄 적으세요.

     ------------------------------------------------------------
     STEP 4 — 점 하나 그리는 함수
     ------------------------------------------------------------
     · dot(col, row) 처럼 칸 번호만 넣으면 그 자리에 점이 찍히게 하세요.
     · STEP 2 의 계산이 이 함수 안으로 들어갑니다.

     확인:  dot(1,1) 하면 정중앙, dot(0,0) 하면 왼쪽 위에 찍혀야 합니다.

     ------------------------------------------------------------
     STEP 5 — 숫자별 눈 배치
     ------------------------------------------------------------
     1 부터 6 까지, 각 숫자가 어느 칸에 점을 찍는지 정하세요.

        1 : 가운데 하나
        2 : 대각선 둘
        3 : 대각선 둘 + 가운데
        4 : 네 모서리
        5 : 네 모서리 + 가운데
        6 : 양쪽 세로줄 가득

     · face(n) 를 부르면 n 의 눈이 그려지게 하세요.
     · 숫자마다 if 를 여섯 번 쓰는 것 말고 다른 방법도 생각해보세요.
       (배열이나 객체에 "어느 칸에 찍을지"를 담아둘 수 있습니다)

     확인:  face(1) ~ face(6) 를 하나씩 호출해서 전부 확인하세요.

     ------------------------------------------------------------
     STEP 6 — 굴리기
     ------------------------------------------------------------
     · #roll 을 누르면 1~6 중 하나가 무작위로 나와서 그려져야 합니다.
     · 지금 숫자를 기억하는 변수를 두세요.

     ⚠️ 6 이 나온 다음 1 이 나왔을 때 점 5개가 남아있으면 실패입니다.
        STEP 3 에서 본 그것입니다.

     ------------------------------------------------------------
     STEP 7 — 기울이기
     ------------------------------------------------------------
     · #tilt 를 누르면 주사위가 15도 기울어진 채로 그려지고,
       다시 누르면 원래대로 돌아와야 합니다.

     · 판만 기울고 점은 제자리에 있으면 안 됩니다. 통째로 기울어야 합니다.
     · 기울인 뒤에 글자까지 같이 기울면 안 됩니다.

     재료만 — save / restore / translate / rotate

     ------------------------------------------------------------
     STEP 8 — 주사위 두 개
     ------------------------------------------------------------
     · 주사위를 왼쪽 오른쪽에 하나씩, 두 개로 늘리세요.
     · 굴리면 둘 다 새 숫자가 나와야 합니다.
     · 아래에 "3 + 5 = 8" 처럼 합계를 글자로 표시하세요. 가운데 정렬.

     힌트 없음. 다만 STEP 1~7 을 "판 하나를 그리는 함수"로 묶어두면
     두 번 부르기만 하면 됩니다.

     ------------------------------------------------------------
     [완성 기준]
       ① 굴릴 때마다 두 주사위가 바뀐다
       ② 이전 눈이 안 남는다  (6 -> 1 을 여러 번 눌러 확인)
       ③ 합계가 맞다
       ④ 기울이기가 켜짐/꺼짐 토글된다
       ⑤ 400, 300 을 직접 쓴 곳이 없다
       ⑥ STEP 3 함정의 예상/실제가 적혀 있다
     ============================================================ */


  // 여기부터 작성하세요.


</script>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - canvas</title>
</head>

<body>
  <style>
    canvas {
      border: 1px solid #000;
    }
  </style>
  <h1 id="title">DAY VISITS</h1>
  <canvas id="canvas" width="520" height="320"></canvas>
  <button id="b1">PC</button>
  <button id="b2">MOBILE</button>
  <p id="note"></p>
</body>
<script src="../lib.js"></script>
<script>
  // ============ 09 - canvas ============
  const ctx = canvas.getContext('2d')
  const cw = canvas.width
  const ch = canvas.height
  function easeing(t) {
    return 1 - Math.pow(1 - t, 3)
  }
  let progress = 0
  let animationId

  fetch("./data.json").then(r => {
    if (!r.ok) throw new Error("Faild to Fetch Data");
    return r.json()
  }).then(json => {

    // datas
    const
      day = json.visits.map(e => e.day),
      pc = json.visits.map(e => e.pc),
      mobile = json.visits.map(e => e.mobile)

    function bars(data) {
      // animation reset
      cancelAnimationFrame(animationId)
      let progress = 0

      // animating
      function draw() {
        ctx.clearRect(0, 0, cw, ch)
        progress = Math.min(progress + 0.002, 1)
        const eased = easeing(progress)
        const gap = 20, padding = 20
        const barW = (cw - padding * 2 - (data.length - 1) * gap) / data.length
        const scale = (ch - padding * 2) / Math.max(...data)
        pc.forEach((v, i) => {
          const barH = scale * v * eased
          ctx.fillRect(padding + i * (barW + gap), ch - padding - barH, barW, barH)
        });
        if (progress < 1) requestAnimationFrame(draw)
      }
      draw()
    }
    b1.addEventListener('click', () => bars(pc))
    b2.addEventListener('click', () => bars(mobile))
    bars(pc)
  })
</script>

</html>

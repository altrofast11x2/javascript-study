<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미션 01 - 디바운스 검색</title>
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: sans-serif;
      line-height: 1.7;
      padding: 16px;
      max-width: 700px;
    }

    h2 {
      margin-top: 28px;
      border-bottom: 1px solid #555;
      padding-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background: #333;
      color: #fff;
      border: 1px solid #666;
    }

    .row {
      border-bottom: 1px solid #444;
      padding: 8px 0;
    }

    .row b {
      color: gold;
    }

    .meta {
      color: #999;
      font-size: 13px;
    }

    #state {
      color: #8cf;
      min-height: 24px;
    }

    #count {
      color: tomato;
      font-weight: bold;
    }

    .empty {
      color: #999;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <h2>미션 01 — 디바운스 검색</h2>

  <p>요청 횟수: <span id="count">0</span></p>
  <input type="text" id="q" placeholder="제목이나 저자로 검색">
  <p id="state"></p>
  <div id="list"></div>

  <script src="../../../lib.js"></script>
  <script>
    /* ============================================================
       미션 01 : 디바운스 검색
       ============================================================

       [상황]
       검색창에 글자를 칠 때마다 서버에 요청을 보내면,
       "코스모스" 다섯 글자를 치는 동안 요청이 5번 나갑니다.
       사용자는 한 번 검색한 건데 서버는 다섯 번 일한 겁니다.

       [목표]
       타이핑이 "멈춘 뒤"에만 요청이 나가게 만든다.

       ------------------------------------------------------------
       STEP 1 — 일부러 나쁜 버전 만들기
       ------------------------------------------------------------
       · #q 에 input 이벤트를 걸고, 칠 때마다 books.json 을 fetch 한다
       · 제목 또는 저자에 검색어가 들어간 책만 #list 에 그린다
       · fetch 를 부를 때마다 #count 의 숫자를 1 올린다
        const q = $("#q")
    const list = $("#list")
    const count = $("#count")
    q.addEventListener('input', () => {
      const render = async () => {
        const res = await fetch("./books.json")
        const data = await res.json()
        const search = q.value.trim()
        count.textContent++
        list.innerHTML = data.books.filter(e => e.title.includes(search) || e.author.includes(search)).map((e, i) => `
        <div>${e.title} ${e.author}</div>`).join('')
      }
      render()
    })
       
       확인:  "코스모스" 를 빠르게 쳐보세요.
              #count 가 몇이 됩니까?  11
              F12 -> Network 탭에도 books.json 이 그만큼 찍힙니다.

       ------------------------------------------------------------
       STEP 2 — 디바운스 걸기
       ------------------------------------------------------------
       · 입력이 멈추고 300ms 가 지나야 fetch 가 나가게 한다
       · 300ms 안에 또 입력하면, 앞의 예약은 취소되고 다시 센다

       확인:  "코스모스" 를 빠르게 쳤을 때 #count 가 1 이어야 합니다.
              천천히 한 글자씩 (0.5초 간격) 치면 5 가 나와야 합니다.

       힌트는 없습니다. 대신 쓸 재료만 적어둡니다 — setTimeout / clearTimeout

       ------------------------------------------------------------
       STEP 3 — 상태 보여주기
       ------------------------------------------------------------
       · 타이핑 중(아직 요청 전)      -> #state 에 "입력 중..."
       · 요청 보내는 중               -> #state 에 "검색 중..."
       · 끝나면                       -> #state 에 "N건" (결과 개수)
       · 검색 결과가 0건이면          -> #list 에 "찾는 책이 없습니다"

       ------------------------------------------------------------
       STEP 4 — 빈 검색어 처리
       ------------------------------------------------------------
       · 검색창을 다 지우면 요청을 보내지 말고 전체를 보여준다
       · (요청 횟수가 안 올라가야 합니다)

       ------------------------------------------------------------
       STEP 5 — 느린 서버 흉내
       ------------------------------------------------------------
       · fetch 앞이나 뒤에 0.8초짜리 delay 를 넣어 응답을 늦춘다
       · 그 상태로 "코스모스" -> 지우고 -> "데미안" 을 빠르게 쳐보세요

       확인:  검색어는 "데미안" 인데 화면에 코스모스가 보이는 순간이 있습니까?
              관찰한 것만 적어두세요. 고치는 건 미션 07 입니다.
              관찰: ___

       ------------------------------------------------------------
       [완성 기준]
         ① 빠르게 쳐도 요청 1번
         ② 천천히 치면 친 만큼
         ③ 검색창 비우면 전체 표시, 요청 0
         ④ 결과 없을 때 안내 문구
       ============================================================ */


    // 여기부터 작성하세요.
    //    · #q 에 input 이벤트를 걸고, 칠 때마다 books.json 을 fetch 한다
    //    · 제목 또는 저자에 검색어가 들어간 책만 #list 에 그린다
    //    · fetch 를 부를 때마다 #count 의 숫자를 1 올린다
    
  </script>
</body>

</html>

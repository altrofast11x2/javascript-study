  <title>08 - 비동기</title>
  <style>
    body {
      background: #222;
      color: #fff;
      font-family: sans-serif;
      line-height: 1.7;
      padding: 16px;
    }

    h2 {
      margin-top: 28px;
      border-bottom: 1px solid #555;
      padding-bottom: 4px;
    }

    .ticket {
      border: 1px solid #888;
      padding: 10px;
      margin: 8px 0;
    }

    .full {
      opacity: .4;
      text-decoration: line-through;
    }

    .hot {
      color: gold;
    }

    .fail {
      color: tomato;
    }

    #spin {
      color: #8cf;
    }

    button,
    input,
    select {
      cursor: pointer;
    }

    #board {
      white-space: pre-line;
    }
  </style>

<body>

  <button id="goSlow">천천히</button>
  <button id="goLuck">복불복</button>
  <button id="goChain">셋 이어서</button>
  <p id="stage">여기에 결과</p>

  <h2>PART 5~8</h2>
  <button id="goList">공연 불러오기</button>
  <button id="goMiss">없는 파일</button>
  <button id="goPair">공연 + 회원</button>
  <p id="spin"></p>
  <p id="oops" class="fail"></p>
  <div id="board"></div>

    // ⚠️ 반드시 Live Server 로 여세요.
    // ⚠️ 쓸 파일: shows.json (공연 목록), member.json (회원)


    // ========== PART 1 : 실행 순서 ==========

    // 1-1. ⭐ 예상 먼저 — 네 줄이 찍히는 순서를 적고 나서 실행하세요
    setTimeout(() => console.log("A"), 100)
    console.log("B")
    setTimeout(() => console.log("C"), 0)
    console.log("D")

    //      실제:B,D,C,A


    // 1-2. #goSlow 를 누르면 #stage 가 이렇게 바뀌게 하세요
    //        누른 즉시   -> "준비..."
    //        2초 뒤      -> "시작!"
    goSlow.addEventListener('click', () => {
      stage.textContent = '준비...'
      setTimeout(() => {
        stage.textContent = '시작!'
      }, 2000);
    })

    // 1-3. 1-2 를 누른 뒤 2초 안에 #goLuck 을 눌러보세요.
    //      화면이 멈춰 있나요? 주석으로 적으세요

    // ========== PART 2 : Promise ==========

    // 2-1. 시간을 인자로 받아서 그 시간 뒤에 성공하는 delay 함수를 만드세요
    //        delay(500)  ->  0.5초 뒤 성공
    const delay = (e) => new Promise(resolve => {
      setTimeout(() => {
        return resolve("성공")
      }, e);
    })

    // 2-2. ⭐ 예상 먼저
    //  console.log(delay(500))
    //      예상: Promise 함수가 반환될거같음.
    //      이유: 왜냐면 Promise 함수는 Promise 를 반환해서

    // 2-3. delay 를 .then 으로 세 번 이어붙여서
    //      0.5초 간격으로 #stage 가 "하나" -> "둘" -> "셋" 으로 바뀌게 하세요
    delay(500).then(() => {
      stage.textContent = '하나'
      return delay(500)
    }).then(() => {
      stage.textContent = '둘'
      return delay(500)
    }).then(() => {
      stage.textContent = '셋'
      return delay(500)
    })

    // 2-4. 70% 확률로 성공하고 30% 확률로 실패하는 Promise 를 만들고
    //      .then 과 .catch 를 붙이세요. #goLuck 에 연결해서 여러 번 눌러보세요
    const chance = () => new Promise((resolve, reject) => {
      if ((Math.random() < .7)) {
        resolve("성공")
      } else {
        reject("실패")
      }
    })
    goLuck.addEventListener('click', () => {
      chance().then(r => stage.textContent = r).catch(err => stage.textContent = err)
    })

    // ========== PART 3 : async / await ==========

    // 3-1. 2-3 을 async/await 로 다시 쓰세요. #goChain 에 연결하세요.
    //      .then 버전과 어느 쪽이 읽기 편한지 주석으로 적으세요
    async function chain() {
      await delay(500)
      stage.textContent = "하나"
      await delay(500)
      stage.textContent = "둘"
      await delay(500)
      stage.textContent = "셋"
    }
    goChain.addEventListener('click', chain)
    // 둘다 똑같다고 느껴짐. 좀더 편한건 async 쓴게 좀더 편한듯?

    // 3-2. ⭐ async 를 빼고 await 만 써보세요
    //      에러: Uncaught SyntaxError: await is only valid in async functions and the top level bodies of modules
    //      확인했으면 되돌리세요

    // 3-3. ⭐ 예상 먼저
    //      const f = async () => 7
    //      console.log(f())
    //      console.log(f() + 1)
    //      예상: 그냥 Promise 요소 랑 Promise+1 요소가 보일거같음.
    //      이유: 잘 모르겠음 ;-;

    // ========== PART 4 : try / catch ==========

    // 4-1. 2-4 의 복불복을 async/await + try/catch 로 다시 쓰세요.
    //      성공하면 #stage 에, 실패하면 #oops 에 표시하세요
    async function chance1() {
      try {
        const res = await chance()
        stage.textContent = res
      } catch (err) {
        oops.textContent = err
      }
    }

    // 4-2. ⭐ try/catch 를 빼고 실패하는 Promise 를 await 하면
    //      콘솔에 뭐가 뜨나요?
    //index.html:187 Uncaught (in promise) ReferenceError: err is not defined at chance1

    // 4-3. 4-1 을 고쳐서 시작할 때 #spin 에 "확인 중..." 을 넣고,
    //      성공이든 실패든 다시 비워지게 하세요
    async function check() {
      try {
        spin.textContent = "확인중..."
        const res = await chance()
        stage.textContent = res
      } catch (err) {
        oops.textContent = err
      } finally {
        spin.textContent = ""
      }
    }
    goLuck.addEventListener('click', check)
    // ========== PART 5 : fetch ==========

    // 5-1. shows.json 을 fetch 해서 res 를 찍으세요. 뭐가 나왔나요?
    async function shows() {
      const res = await fetch("./shows.json")
      const data = await res.json()
      return data;
    }
    shows()
    // 5-2. res.json() 을 찍으세요. 뭐가 나왔나요?

      return console.log(data);;

      const res = await fetch("./shows.json")
      const data = await res.json()
      return console.log(data.shows);
    }
    shows()

    // 5-4. 공연 제목만 배열로 뽑으세요
    async function shows() {
      const res = await fetch("./shows.json")
      const data = await res.json()
      return console.log(data.shows.map(e => e.title));
    }
    shows()

    // 5-5. 대극장 공연이 몇 개인지 세서 찍으세요
    async function shows() {
      const res = await fetch("./shows.json")
      const data = await res.json()
      return console.log(data.shows.filter(e => e.hall === '대극장').length);
    }
    shows()

    async function shows() {
      try {
        const res = await fetch("./nope.json")
        const data = await res.json()
      } catch (error) {
        console.log(error);
      }
    }
    shows()

    async function shows() {
      try {
        const res = await fetch("./shows.json")
        const data = await res.json()
        console.log(res.ok); //true
        console.log(res.status); //200
      } catch (error) {

      }
    }

    // ========== PART 7 : Promise.all ==========

    // 7-1. shows.json 과 member.json 을 하나씩 순서대로 await 하고
    //      console.time / console.timeEnd 로 걸린 시간을 재세요
    async function promise(params) {
      console.time()
      const res1 = await fetch("./shows.json")
      const data1 = await res1.json()
      const res2 = await fetch("./member.json")
      const data2 = await res2.json()
      console.timeEnd();
    }
    promise()

    // 7-2. 같은 걸 동시에 가져오도록 바꾸고 시간을 비교하세요
    async function test() {
      console.time()
      await Promise.all([
        fetch("./shows.json"),
        fetch("./member.json"),
      ])
      console.timeEnd()
    }
    test()
    // 7-3. #goPair 에 연결해서 #stage 에 이렇게 보여주세요
    //      -> "노벨(GOLD) - 공연 5개, 쿠폰 2장"
    async function gold() {
      const res = await fetch("./shows.json")
      const res2 = await fetch("./member.json")
      const data = await res.json()
      const data2 = await res2.json()
      return console.log(`${data2.name}(${data2.grade}) - 공연 ${data.shows.length}개 쿠폰 ${data2.coupon}장`);
    }
    gold();

    // ========== PART 8 : 로딩과 에러 ==========

    // 8-3. 좌석이 10석 미만이고 0 은 아닌 카드에 "hot" 클래스를 붙이세요

    // 8-5. 에러가 나도 #spin 이 남지 않게 하세요
    // goList.addEventListener('click', async () => {
    //   try {
    //     spin.textContent = "불러오는 중..."
    //     const res = await fetch("./shows.json")
    //     if (!res.ok) {
    //       throw new Error(`불러오기 실패 (${res.status})`)
    //     }
    //     const data = await res.json()
    //     board.innerHTML = data.shows
    //       .map(e =>
    //         `<div class="${e.seats <= 10 && e.seats > 0 ? "hot" : ""}">

    //       .join("\n")
    //   } catch (error) {
    //     board.textContent = error.message

    // ========== PART 9 : 종합 ==========

    // 9-1. 페이지가 열리면 자동으로 shows.json 을 불러와 #board2 에 그리세요
    let save = []

    async function load() {
      try {
        spin.textContent = "불러오는 중..."

        const res = await fetch("./shows.json")
        if (!res.ok) {
          throw new Error(`불러오기 실패 (${res.status})`)
        }

        const data = await res.json()
        save = data.shows

        board2.innerHTML = save
          .map(e =>
            `<div class="${e.seats <= 10 && e.seats > 0 ? "hot" : ""}">
          ${e.title} / ${e.price} / ${e.seats} / ${e.hall}
        </div>`
          ).join("\n")

      } catch (error) {
        board2.textContent = error.message
      } finally {
        spin.textContent = ""
      }
    }

    load()

    // 9-2. 검색이나 정렬할 때마다 fetch 가 다시 돌면 안 됩니다. 그렇게 만드세요.
    //      왜 그래야 하는지 주석으로 적으세요
    // 우선은 계속 fetch 하면 데이터가 많으면 시간도 오래 걸리기도하고 트래픽이 많이 길어져서입니다.

    // 9-3. #find 에 입력할 때마다 제목에 검색어가 들어간 것만 그리세요
    find.addEventListener('input', () => {
      const search = find.value.trim()

      board2.innerHTML = save
        .filter(e => e.title.includes(search))
        .map(e =>
          `<div class="${e.seats <= 10 && e.seats > 0 ? "hot" : ""}">
        ${e.title} / ${e.price} / ${e.seats} / ${e.hall}
      </div>`
        ).join("\n")
    })

    // 9-4. #by 로 제목순 / 가격 낮은순 / 가격 높은순 정렬이 되게 하세요.

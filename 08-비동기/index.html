<head>

  <title>08 - 비동기</title>
  <style>

<body>

  <button id="btnFail">없는 파일 불러오기</button>

  <p id="err" class="err"></p>
  <div id="list"></div>

  <h2>PART 9 : 종합</h2>
  <input type="text" id="search" placeholder="상품 검색">
  <select id="sort">
    <option value="name">이름순</option>
    <option value="price">가격 낮은순</option>
    <option value="priceDesc">가격 높은순</option>
  </select>
  <div id="list2"></div>

  <script src="../lib.js"></script>
  <script>
    // ============ 08 : 비동기 ============
    //
    // ⚠️ 이번 Day 는 반드시 Live Server 로 여세요. (파일 더블클릭 ❌)
    //    file:// 로 열면 fetch 가 CORS 에러로 전부 막힙니다.
    //    VS Code 에서 index.html 우클릭 -> "Open with Live Server"
    //
    // ⚠️ await 는 async 함수 안에서만 쓸 수 있습니다.
    //    그냥 바깥에 쓰면 SyntaxError 가 나면서 파일 전체가 안 돌아갑니다.


    // ========== PART 1 : 실행 순서 ==========

    // 1-1. ⭐ 순서 맞히기
    //      아래 세 줄을 "그냥 눈으로" 보고 찍힐 순서를 먼저 주석에 적으세요.
    //      그 다음 실행해서 맞았는지 확인하세요.
    console.log("1")
    setTimeout(() => console.log("2"), 0)
    console.log("3")
    //      내 예상: 1,3,2
    //      실제: 1,3,2 


    // 1-2. #btnDelay 를 누르면 3초 뒤에 #out 에 "3초 지났다" 가 뜨게 하세요.
    //      누른 직후에는 #out 에 "기다리는 중..." 이 바로 떠야 합니다.
    btnDelay.onclick = () => {
      out.textContent = '기다리는중...'
      setTimeout(() => {
        out.textContent = '3초 지났다'
      }, 3000);
    }

    // 1-3. 1-2 를 누르고 나서 3초 안에 다른 버튼을 눌러보세요.
    //      화면이 멈춰 있나요? 주석으로 적으세요
    // 아니오

    // ========== PART 2 : Promise ==========

    // 2-1. 1초 뒤에 "완료!" 로 성공하는 Promise 를 돌려주는 함수 wait1 을 만드세요
    //      const wait1 = () => new Promise(resolve => { ... })
    const wait1 = () => new Promise(resolve => {
      setTimeout(() => {
        resolve("완료!");
      }, 1000);
    })
    // 2-2. wait1() 을 그냥 console.log 로 찍어보세요. 뭐가 나오나요?
    //      1초를 기다려도 "완료!" 가 아닙니다. 왜 그런지 주석으로 적으세요
    console.log(wait1()); //Promise {pending} 이 뜸 왜냐면 1초 뒤에 나오는데 console.log() 는 1초뒤에 안나오고 그거보다 먼저 나왔기 때문이다

    // 2-3. .then 으로 결과를 받아 #out 에 보여주세요
    wait1().then(r => out.textContent = r)

    // 2-4. 50% 확률로 성공/실패하는 Promise 를 만들고 (Math.random() < 0.5)
    //      .then 과 .catch 를 둘 다 붙이세요. #btnPromise 에 연결해서 여러 번 눌러보세요
    const chance = () => new Promise((resovle, reject) => {
      if (Math.random() > .5) {
        resovle()
      } else {
        reject()
      }
    })
    btnPromise.onclick = () => { chance().then(() => out.textContent = "성공").catch(() => out.textContent = "실패") }

    // ========== PART 3 : async / await ==========

    // 3-1. 2-3 을 async/await 로 다시 쓰세요
    //      async 함수를 만들고 그 안에서 await wait1()
    async function wait1_1() {
      const res = await wait1()
      return res
    }
    wait1_1()
    // 3-2. ⭐ 일부러 터뜨리기
    //      async 를 빼고 await 만 써보세요. 에러를 주석에 적고 되돌리세요
    //      에러:SyntaxError: await is only valid in async functions and the top level bodies of modules
    // function wait1_1() {
    //   const res = await wait1()
    // }
    // 3-3. async 함수를 호출해서 그 반환값을 console.log 로 찍어보세요
    //      "완료!" 가 나오나요? 왜 그런지 주석으로 적으세요
    console.log(wait1_1());
    // 안나옵니다, async 는 항상 Promise 를 반환해서입니다.

    // ========== PART 4 : try / catch ==========

    // 4-1. 2-4 의 랜덤 Promise 를 async/await + try/catch 로 다시 쓰세요
    //      성공하면 #out 에, 실패하면 #err 에 표시
    async function chance2() {
      try {
        const res = await chance()
      } catch {
        err.textContent = "실패";
      }
    }
    chance2()
    // 4-2. try/catch 없이 await 로 실패하는 Promise 를 기다리면 어떻게 되는지
    //      콘솔을 보고 주석으로 적으세요
    // async function chance3() {
    //   const res = await chance()
    // }
    // console.log(chance3());
    // 실패하면  Uncaught (in promise) undefined  오류가 뜸.

    // 4-3. 4-1 을 고쳐서, 시작할 때 #loading 에 "처리 중..." 을 넣으세요.
    //      그리고 finally 를 붙여서 성공이든 실패든 그걸 다시 비우세요.
    //      (넣는 곳은 한 군데, 비우는 곳도 한 군데. try 와 catch 양쪽에
    //       비우는 코드를 넣지 말라는 게 finally 의 존재 이유입니다)
    

    // ========== PART 5 : fetch 기본 ==========

    // 5-1. async 함수 안에서 data.json 을 fetch 해서 응답(res)을 찍어보세요
    //      아직 상품 목록이 아닙니다. 뭐가 찍히나요?


    // 5-2. res.json() 을 찍어보세요. 이것도 상품 목록이 아닙니다. 뭐가 찍히나요?


    // 5-3. await 를 한 번 더 붙여서 진짜 데이터를 꺼내세요
    //      await 를 왜 두 번 하는지 주석으로 적으세요


    // 5-4. 꺼낸 데이터에서 상품 이름만 배열로 뽑으세요 (Day 05 의 map)


    // ========== PART 6 : fetch 의 함정 ==========

    // 6-1. ⭐ #btnFail 에 연결 — 없는 파일(예: nope.json)을 fetch 하고
    //      try/catch 로 감싸세요. catch 가 잡히나요?
    //      네트워크 탭에는 404 가 떴는데 catch 는 안 잡힙니다. 주석으로 적으세요


    // 6-2. res.ok 와 res.status 를 찍어보세요


    // 6-3. res.ok 가 false 면 직접 throw 해서 catch 로 보내세요
    //      #err 에 "불러오기 실패 (404)" 처럼 표시


    // ========== PART 7 : Promise.all ==========

    // 7-1. data.json 과 user.json 을 "하나씩 순서대로" await 해서 가져오세요
    //      console.time / console.timeEnd 로 걸린 시간을 재보세요


    // 7-2. 같은 걸 Promise.all 로 "동시에" 가져오세요. 시간을 비교하세요


    // 7-3. #btnAll 에 연결해서 #out 에 "노벨(VIP) - 상품 5개" 처럼 보여주세요


    // ========== PART 8 : 로딩과 에러 ==========

    // 8-1. #btnLoad 를 누르면:
    //        누르자마자  -> #loading 에 "불러오는 중..."
    //        다 받으면   -> #loading 비우고 #list 에 카드 그리기
    //      카드는 nl 로 만드세요. 이름 / 가격 / 재고가 보이게


    // 8-2. 재고가 0 인 상품 카드에는 "soldout" 클래스를 붙이세요


    // 8-3. 에러가 나도 #loading 이 남지 않게 finally 로 처리하세요


    // ========== PART 9 : 종합 ==========
    // Day 05(배열) + 06(DOM) + 07(이벤트) + 08(비동기) 전부 나옵니다.

    // 9-1. 페이지가 열리면 자동으로 data.json 을 불러와서 #list2 에 그리세요
    //      (버튼 없이. 함수를 만들고 마지막에 한 번 호출)


    // 9-2. 받아온 데이터를 변수 하나에 저장해두세요.
    //      검색/정렬할 때마다 다시 fetch 하면 안 됩니다. 왜 그런지 주석으로 적으세요


    // 9-3. #search 에 input 이벤트를 붙여서, 이름에 검색어가 들어간 것만 그리세요


    // 9-4. #sort 에 change 를 붙여서 이름순 / 가격 낮은순 / 가격 높은순으로 정렬하세요
    //      ⚠️ 원본 배열을 sort 하면 안 됩니다 (Day 04 의 그 함정)


    // 9-5. 검색과 정렬이 "같이" 먹게 하세요
    //      힌트: 그리는 함수 하나를 만들고, 그 안에서 filter -> sort -> 그리기


  </script>

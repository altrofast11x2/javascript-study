    async function chance() {
      try {
        $("#note").textContent = '던지는 중...'

          $("#view").textContent = "성공"
        } else {

        $("#alarm").textContent = error.message

        $("#note").textContent = ""
        await delay(2000)
        $("#view").textContent = "여기에 결과"
        await delay(2000)
        $("#alarm").textContent = ""
      }
    }

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 - localStorage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .wrap {
      max-width: 620px;
    }

    /* ---------- 상단 조작 영역 ---------- */
    .bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    input,
    select,
    button {
      padding: 7px 10px;
      background: #111;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #8cf;
    }

    #q {
      flex: 1;
      min-width: 160px;
    }

    button {
      background: #333;
      border-color: #666;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #444;
    }

    /* ---------- 필터 탭 ---------- */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab.on {
      background: #8cf;
      border-color: #8cf;
      color: #111;
      font-weight: bold;
    }

    /* ---------- 요약 ---------- */
    #summary {
      font-size: 13px;
      color: #8cf;
      margin-bottom: 10px;
      min-height: 18px;
    }

    /* ---------- 목록 ---------- */
    #list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 12px;
    }

    .card .body {
      flex: 1;
      min-width: 0;
    }

    .card .title {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .card .meta {
      font-size: 12px;
      color: #888;
    }

    /* 읽은 항목은 흐리게 */
    .card.read {
      opacity: 0.45;
    }

    .card.read .title {
      text-decoration: line-through;
    }

    /* 즐겨찾기 버튼 */
    .star {
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      background: none;
      border: none;
      color: #555;
    }

    .star:hover {
      background: none;
      color: #888;
    }

    .star.on {
      color: #fd5;
    }

    /* 읽음 체크 */
    .card label {
      font-size: 12px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      cursor: pointer;
    }

    .card label input {
      width: auto;
      padding: 0;
    }

    /* 결과 없음 */
    .empty {
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>읽을 거리 보관함</h1>

    <div class="bar">
      <input type="search" id="q" placeholder="제목 또는 글쓴이">
      <select id="category">
        <option value="">전체 분류</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
        <option value="접근성">접근성</option>
        <option value="도구">도구</option>
      </select>
      <select id="sort">
        <option value="default">기본순</option>
        <option value="title">제목순</option>
        <option value="short">짧은 것부터</option>
        <option value="long">긴 것부터</option>
      </select>
      <button type="button" id="reset">저장 초기화</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab" data-filter="all">전체</button>
      <button type="button" class="tab" data-filter="fav">즐겨찾기</button>
      <button type="button" class="tab" data-filter="unread">안 읽음</button>
    </div>

    <p id="summary"></p>

    <ul id="list"></ul>
  </div>

  <script src="../lib.js"></script>
  <script>
    // ============ 12 - localStorage ============
    let save = []

const fav = {
  toggle(i) {
    save[i].fav ^= 1
    write("star", save.filter(e => e.fav).map(e => e.id))
    draw(save)
  }
}

const readed = {
  toggle(i) {
    save[i].readed ^= 1
    write("readed", save.filter(e => e.readed).map(e => e.id))
    draw(save)
  }
}

const list = $("#list")

const draw = (l) => {
  list.innerHTML = l.map((e, i) =>
    `<li class='card ${e.readed ? "read" : ""}'>
      ${e.title} /
      ${e.author} /
      ${e.category} /
      ${e.minutes}분
      <button class='star ${e.fav ? "on" : "off"}' onclick="fav.toggle(${i})">★</button>
      <label>
        <input type="checkbox" ${e.readed ? "checked" : ""} onchange="readed.toggle(${i})">
      </label>
    </li>`
  ).join('')
}

const read = (key) => {
  try {
    const data = JSON.parse(localStorage.getItem(key))
    return Array.isArray(data) ? data : []
  } catch {
    return []
  }
}

const write = (key, data) => {
  try {
    localStorage.setItem(key, JSON.stringify(data))
  } catch (error) {
    console.log(error.message)
  }
}

const load = async () => {
  try {
    const res = await fetch("./items.json")
    if (!res.ok) throw new Error("서버 오류")

    const item = await res.json()
    const stars = read("star")
    const reads = read("readed")

    save = item.items.map(e => ({
      ...e,
      fav: stars.includes(e.id) ? 1 : 0,
      readed: reads.includes(e.id) ? 1 : 0
    }))

    draw(save)
  } catch (error) {
    console.log(error.message)
  }
}

load()
    /* ============================================================
       미션 : 읽을 거리 보관함

       화면 요소   검색      #q
       
                   분류      #category  (전체 / HTML / CSS / JavaScript / 접근성 / 도구)
                   정렬      #sort      (기본순 / 제목순 / 짧은 것부터 / 긴 것부터)

                   초기화    #reset
                   요약      #summary

       바깥 틀과 CSS 는 다 만들어놨습니다.

       HTML 에 이미 있습니다.

       카드 안쪽은 없습니다. #list 안에 들어갈 HTML 은 items.json 을 읽어서

       CSS 는 .card / .card.read / .star / .star.on / .empty 까지 다 준비해놨으니

       · items.json 을 읽어서 #list 에 20개를 그리세요.

       · 소요시간은 "6분" 처럼 단위를 붙입니다.

       재료만 - fetch, map, join  (또는 lib.js 의 nl)

       ------------------------------------------------------------
       STEP 2 - (함정) 별을 눌러 저장하기
       ------------------------------------------------------------
       · 별을 누르면 그 항목이 즐겨찾기가 되게 하세요.
       · 즐겨찾기한 id 들을 배열에 모아서 localStorage 에 저장하세요.
       · 저장할 때 일단 배열을 그대로 넣어보세요. (일부러)

       · 새로고침하고 저장된 값을 꺼내보세요.

         예상: 저장 잘됨.
         실제: 저장 잘됨.
         왜 그런지: 내가 localstorage.setitem("star")로 빈 로컬을 만들고 밑에 로딩함수에서 save(전역변수) 로 save 에서 필터된거를 받아서 해석하고 star 받고 출력하게함..

       · 고치세요. 넣을 때와 꺼낼 때 각각 한 번씩 거쳐야 합니다.

       확인 : 개발자도구 Application 탭 > Local Storage 에서 값이 어떻게 보입니까?

       ------------------------------------------------------------

         실제: ["a1","a2"]
         왜 그런지: ["a1","a2"]

       확인 : 읽기/쓰기 함수를 만든 뒤에, 나머지 코드에 getItem 과 setItem 이
              한 개도 없어야 합니다. 있으면 저장소를 만지는 곳이 흩어진 겁니다.

       재료만 - try / catch, ?? 연산자

       ------------------------------------------------------------
       · 읽음 체크를 누르면 읽음이 되고, 카드가 흐려지게 하세요.
       · 새로고침해도 남아 있어야 합니다.

       확인 : 즐겨찾기와 읽음을 저장소에 어떻게 나눠 담았습니까?

       ------------------------------------------------------------
       STEP 5 - (함정) 화면을 손으로 고치면
       ------------------------------------------------------------
       · 검색, 분류, 정렬, 필터 탭을 만드세요. 네 개가 동시에 걸려야 합니다.

       ------------------------------------------------------------

       [완성 기준]
         1) 저장소를 만지는 곳이 읽기/쓰기 함수 두 개뿐이다
         2) 저장값이 없을 때도, 망가졌을 때도 화면이 정상이다

         7) 검색이 제목과 글쓴이를 보고, 대소문자를 구분하지 않는다

        16) 화면을 손으로 고치는 코드가 없다 (데이터 -> 저장 -> 다시 그리기)
        17) addEventListener 가 내가 만든 함수 안에 들어간 곳이 하나도 없다

<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 - localStorage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 14px;
      color: #8cf;
      margin-bottom: 8px;
      font-weight: normal;
    }

    .wrap {
      max-width: 1100px;
    }

    /* ---------- 상단 조작 영역 ---------- */
    .bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    input,
    select,
    button {
      padding: 7px 10px;
      background: #111;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #8cf;
    }

    #q {
      flex: 1;
      min-width: 160px;
    }

    button {
      background: #333;
      border-color: #666;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    button:disabled:hover {
      background: #333;
    }

    .check {
      font-size: 13px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      cursor: pointer;
    }

    .check input {
      width: auto;
      padding: 0;
    }

    /* ---------- 최근 본 상품 ---------- */
    .recentrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 26px;
    }

    .recentlabel {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    /* 칩이 들어가는 칸. 여기에 .chip 을 그려 넣습니다 */
    .recent {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chip {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 3px 9px;
      color: #ccc;
    }

    /* ---------- 요약 ---------- */
    #summary {
      font-size: 13px;
      color: #8cf;
      margin-bottom: 10px;
      min-height: 18px;
    }

    /* ---------- 두 칸 ---------- */
    .cols {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .col {
      flex: 1;
      min-width: 0;
    }

    #list,
    #cart {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ---------- 상품 카드 ---------- */
    .card,
    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px 12px;
    }

    .body {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .meta {
      font-size: 12px;
      color: #888;
    }

    .price {
      font-size: 13px;
      color: #eee;
      white-space: nowrap;
    }

    /* 품절은 흐리게 */
    .card.soldout {
      opacity: 0.45;
    }

    /* 장바구니에 담긴 상품은 테두리로 표시 */
    .card.in {
      border-color: #8cf;
    }

    /* ---------- 장바구니 줄 ---------- */
    .qty {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty button {
      padding: 2px 7px;
      font-size: 13px;
      line-height: 1.3;
    }

    .qty span {
      min-width: 20px;
      text-align: center;
      font-size: 13px;
    }

    .del {
      padding: 2px 7px;
      font-size: 12px;
      color: #c88;
    }

    /* ---------- 합계 ---------- */
    #total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #444;
      font-size: 14px;
      text-align: right;
      min-height: 20px;
    }

    #clear {
      margin-top: 10px;
      width: 100%;
    }

    /* ---------- 비었을 때 ---------- */
    .empty {
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>문구점 장바구니</h1>

    <div class="bar">
      <input type="text" id="q" placeholder="상품명 / 브랜드 검색">
      <select id="kind">
        <option value="">전체 분류</option>
        <option value="필기구">필기구</option>
        <option value="노트">노트</option>
        <option value="지우개">지우개</option>
        <option value="파일">파일</option>
        <option value="테이프">테이프</option>
      </select>
      <select id="sort">
        <option value="default">기본순</option>
        <option value="name">이름순</option>
        <option value="cheap">싼 것부터</option>
        <option value="expensive">비싼 것부터</option>
      </select>
      <label class="check"><input type="checkbox" id="soldout"> 품절 숨기기</label>
    </div>

    <div class="recentrow">
      <span class="recentlabel">최근 본</span>
      <p class="recent" id="recent"></p>
    </div>
    <p id="summary"></p>

    <div class="cols">
      <section class="col">
        <h2>상품</h2>
        <ul id="list"></ul>
      </section>
      <section class="col">
        <h2>장바구니</h2>
        <ul id="cart"></ul>
        <p id="total"></p>
        <button type="button" id="clear">장바구니 비우기</button>
      </section>
    </div>
  </div>

  <script src="../lib.js"></script>
  <script>
    // ============ 12 - localStorage ============

    // 저장소에 들어가는 키는 전부 이 접두어를 달고 들어간다.
    // 비우기에서 이것만 골라 지우면 남의 키는 건드리지 않는다.
    const PRE = "study12:"

    let product = []    // products.json 원본. 저장소에 절대 넣지 않는다
    let save = []       // 내가 담은 것   [{ id, qty }] 만
    let recent = []     // 최근 본 id     ["p06", "p05", ...]
    let filter = { q: "", kind: "", sort: "default", soldout: false }

    const list = $("#list")
    const cart = $("#cart")
    const recentBox = $("#recent")
    const summary = $("#summary")
    const total = $("#total")
    const clearBtn = $("#clear")
    const q = $("#q")
    const kind = $("#kind")
    const sort = $("#sort")
    const soldout = $("#soldout")

    /* ---------- 저장소 ----------
       getItem / setItem 은 이 두 함수 안에만 있다.
       store 를 넘기면 sessionStorage 에도 같은 함수를 쓴다. */
    const read = (key, fallback, store = localStorage) => {
      try {
        const data = JSON.parse(store.getItem(PRE + key))
        if (data === null || data === undefined) return fallback   // 처음 온 사람
        if (typeof data !== "object") return fallback              // 숫자/문자가 들어있음
        if (Array.isArray(fallback) !== Array.isArray(data)) return fallback  // 모양이 다름
        return data
      } catch (error) {
        return fallback                                            // abc 같은 깨진 값
      }
    }

    const write = (key, data, store = localStorage) => {
      try {
        store.setItem(PRE + key, JSON.stringify(data))
      } catch (error) {
        console.error("저장 실패 :", error.message)                // 5MB 넘침 등
      }
    }

    /* ---------- 꺼낸 값 청소 ----------
       저장소에서 꺼낸 값은 남이 써놓은 값이다.
       없는 상품, 품절, 이상한 수량, 중복 id 를 여기서 전부 걸러낸다. */
    const clean = (rows) => {
      const out = []
      rows.forEach(row => {
        if (!row || typeof row !== "object") return
        const item = product.find(p => p.id === row.id)
        if (!item || item.stock < 1) return                 // products.json 에 없거나 품절
        if (out.some(o => o.id === row.id)) return          // 같은 id 가 두 번
        const num = Math.floor(Number(row.qty)) || 1
        out.push({ id: row.id, qty: Math.min(Math.max(num, 1), item.stock) })
      })
      return out
    }

    /* ---------- 화면 그리기 ----------
       화면을 건드리는 코드는 아래 그리기 함수들 안에만 있다. */
    const money = (n) => n.toLocaleString("ko-KR") + "원"

    const visible = () => {
      let copy = [...product]
      const word = filter.q.trim().toLowerCase()
      if (word) copy = copy.filter(e =>
        e.name.toLowerCase().includes(word) || e.brand.toLowerCase().includes(word))
      if (filter.kind) copy = copy.filter(e => e.kind === filter.kind)
      if (filter.soldout) copy = copy.filter(e => e.stock > 0)
      if (filter.sort === "name") copy.sort((a, b) => a.name.localeCompare(b.name, "ko-KR"))
      if (filter.sort === "cheap") copy.sort((a, b) => a.price - b.price)
      if (filter.sort === "expensive") copy.sort((a, b) => b.price - a.price)
      return copy
    }

    const drawList = (rows) => {
      if (!rows.length) {
        list.innerHTML = `<li class="empty">조건에 맞는 상품이 없습니다.</li>`
        return
      }
      list.innerHTML = rows.map(e => `
        <li class="card ${e.stock ? "" : "soldout"} ${save.some(s => s.id === e.id) ? "in" : ""}">
          <div class="body">
            <p class="title" onclick="viewer.view('${e.id}')">${e.name}</p>
            <p class="meta">${e.brand} / ${e.kind} / 재고 ${e.stock}개</p>
          </div>
          <p class="price">${money(e.price)}</p>
          <button onclick="put.add('${e.id}')" ${e.stock ? "" : "disabled"}>담기</button>
        </li>`).join("")
    }

    const drawCart = () => {
      if (!save.length) {
        cart.innerHTML = `<li class="empty">장바구니가 비어 있습니다.</li>`
        return
      }
      // save 는 clean 을 통과한 값이라 find 가 반드시 찾는다
      cart.innerHTML = save.map(s => {
        const item = product.find(p => p.id === s.id)
        return `
        <li class="line">
          <div class="body">
            <p class="title">${item.name}</p>
            <p class="meta">${item.brand} / ${money(item.price)}</p>
          </div>
          <div class="qty">
            <button onclick="put.minus('${s.id}')">-</button>
            <span>${s.qty}</span>
            <button onclick="put.plus('${s.id}')">+</button>
          </div>
          <p class="price">${money(item.price * s.qty)}</p>
          <button class="del" onclick="put.remove('${s.id}')">X</button>
        </li>`
      }).join("")
    }

    const drawRecent = () => {
      recentBox.innerHTML = recent.map(id => {
        const item = product.find(p => p.id === id)
        return item ? `<span class="chip">${item.name}</span>` : ""
      }).join("")
    }

    const drawSummary = (rows) => {
      const count = save.reduce((sum, s) => sum + s.qty, 0)
      const won = save.reduce((sum, s) =>
        sum + product.find(p => p.id === s.id).price * s.qty, 0)
      summary.textContent =
        `상품 ${product.length}개 중 ${rows.length}개 표시 / 장바구니 ${save.length}종 ${count}개`
      total.textContent = `합계 ${money(won)}`
    }

    // 데이터가 바뀌면 이것만 부른다
    const render = () => {
      const rows = visible()
      drawList(rows)
      drawCart()
      drawRecent()
      drawSummary(rows)
    }

    /* ---------- 장바구니 ----------
       순서를 하나로 고정한다 : 데이터를 고치고 -> 저장하고 -> 다시 그린다 */
    const put = {
      add(id) {
        const item = product.find(p => p.id === id)
        if (!item || item.stock < 1) return          // 품절은 담을 수 없다
        const already = save.find(s => s.id === id)
        if (already) {
          if (already.qty >= item.stock) return      // 재고까지만
          already.qty++
        } else {
          save.push({ id, qty: 1 })                  // 이름과 가격은 넣지 않는다
        }
        this.done()
      },
      plus(id) {
        const s = save.find(e => e.id === id)
        const item = product.find(p => p.id === id)
        if (!s || !item || s.qty >= item.stock) return
        s.qty++
        this.done()
      },
      minus(id) {
        const s = save.find(e => e.id === id)
        if (!s || s.qty <= 1) return                 // 1 보다 작아지지 않는다
        s.qty--
        this.done()
      },
      remove(id) {
        save = save.filter(e => e.id !== id)
        this.done()
      },
      done() {
        write("cart", save)
        render()
      }
    }

    /* ---------- 최근 본 상품 ----------
       sessionStorage 다. 이 탭에서만 의미가 있는 값이라서 그렇다.
       장바구니는 다음에 와서도 남아야 하니까 localStorage. */
    const viewer = {
      view(id) {
        recent = [id, ...recent.filter(e => e !== id)].slice(0, 5)   // 중복 제거 + 최신 앞 + 5개
        write("recent", recent, sessionStorage)
        render()
      }
    }

    /* ---------- 검색 / 분류 / 정렬 / 품절 숨기기 ----------
       고른 것도 저장한다. 등록은 함수 밖, 최상단에서 한 번만. */
    const pick = () => {
      filter = { q: q.value, kind: kind.value, sort: sort.value, soldout: soldout.checked }
      write("filter", filter)
      render()
    }
    q.oninput = pick
    kind.onchange = pick
    sort.onchange = pick
    soldout.onchange = pick

    // 저장된 선택을 화면 칸에 되돌려 놓는다
    const fillForm = () => {
      q.value = filter.q ?? ""
      kind.value = filter.kind ?? ""
      sort.value = filter.sort ?? "default"
      soldout.checked = !!filter.soldout
    }

    /* ---------- 비우기 ----------
       clear() 는 이 사이트의 다른 키까지 다 날린다.
       접두어가 붙은 내 키만 골라서 지운다. */
    clearBtn.onclick = () => {
      if (!confirm("장바구니와 검색 조건을 모두 지울까요? 되돌릴 수 없습니다.")) return
      Object.keys(localStorage)
        .filter(key => key.startsWith(PRE))
        .forEach(key => localStorage.removeItem(key))
      save = []
      filter = { q: "", kind: "", sort: "default", soldout: false }
      fillForm()
      render()
      // 최근 본 것은 sessionStorage 라서 탭을 닫으면 어차피 사라진다. 그대로 둔다
    }

    /* ---------- 다른 탭 ----------
       storage 는 "다른" 탭에서만 울린다. 저장한 그 탭에서는 울리지 않는다.
       그래서 위의 put / pick 은 직접 render 를 부르고, 여기는 다시 읽고 그린다. */
    window.addEventListener("storage", (e) => {
      if (e.storageArea !== localStorage) return
      if (e.key !== null && !e.key.startsWith(PRE)) return   // 남의 키는 무시
      save = clean(read("cart", []))
      filter = read("filter", { q: "", kind: "", sort: "default", soldout: false })
      fillForm()
      render()
    })

    /* ---------- 시작 ---------- */
    const load = async () => {
      try {
        const res = await fetch("./products.json")
        if (!res.ok) throw new Error("상품 목록을 불러오지 못했습니다.")
        const data = await res.json()
        product = data.products                  // 바깥이 배열이 아니라 객체다

        save = clean(read("cart", []))
        write("cart", save)                      // 청소한 결과를 되돌려 저장한다
        recent = read("recent", [], sessionStorage)
          .filter(id => product.some(p => p.id === id))
        filter = read("filter", filter)
        fillForm()
        render()
      } catch (error) {
        list.innerHTML = `<li class="empty">${error.message}</li>`
        console.error(error)
      }
    }
    load()

    /* ============================================================
       미션 : 문구점 장바구니

       화면 요소   검색        #q        (상품명 + 브랜드)
                   분류        #kind     (전체 / 필기구 / 노트 / 지우개 / 파일 / 테이프)
                   정렬        #sort     (기본순 / 이름순 / 싼 것부터 / 비싼 것부터)
                   품절 숨기기 #soldout  (체크박스)
                   최근 본     #recent   (비어 있습니다)
                   요약        #summary  (비어 있습니다)
                   상품 목록   #list     (비어 있습니다)
                   장바구니    #cart     (비어 있습니다)
                   합계        #total    (비어 있습니다)
                   비우기      #clear

       데이터      products.json   18개
                   id / name / brand / kind / price / stock
                   stock 이 0 이면 품절입니다. 3개 있습니다.

       바깥 틀과 CSS 는 다 만들어놨습니다.
       검색, 분류, 정렬, 체크박스, 비우기 버튼, 그리고 비어 있는 자리
       (#recent / #summary / #list / #cart / #total) 가 HTML 에 이미 있습니다.

       그 안에 들어갈 HTML 은 없습니다. 상품 카드도, 장바구니 줄도,
       담기 버튼도, 수량 버튼도 products.json 을 읽어서 직접 만들어 넣습니다.
       CSS 는 아래 이름까지 다 준비해놨으니 클래스 이름만 맞추면 모양은 나옵니다.

         .card  .card.soldout(흐리게)  .card.in(테두리 강조)
         .line  .qty  .del
         .body  .title  .meta  .price
         .chip(최근 본 한 칸)  .empty(비었음 안내)

       STEP 하나씩 하고 보여주세요. 한 번에 다 하면 어디서 틀렸는지 못 찾습니다.
       끝낸 STEP 은 주석으로 바꿔서 아래에 쌓아두세요.

       ------------------------------------------------------------
       [ 질문권 3장 ]
       ------------------------------------------------------------
         · 내 답에 코드가 한 줄이라도 나오면       1장
         · 코드 없이 "어디를 찾아봐라" 만 들어도   1장
         · 다 끝내고 "체점해줘"                   0장

         1장 :
         2장 :
         3장 :

       ------------------------------------------------------------
       STEP 1 - 저장은 나중에. 상품 목록부터
       ------------------------------------------------------------
       localStorage 는 아직 한 줄도 쓰지 않습니다.

       · products.json 을 읽어서 #list 에 18개를 그리세요.
       · 카드 하나에 상품명, 브랜드, 분류, 재고, 가격, 담기 버튼이 들어갑니다.
       · 가격은 1,800원 처럼 천 단위 콤마와 "원" 을 붙입니다.
       · 품절(stock 0)인 카드는 흐리게 하고, 담기 버튼은 누를 수 없게 하세요.

       확인 : 18개가 다 나옵니까? 품절 3개가 구분되어 보입니까?
       확인 : 그리는 일이 함수 하나에 들어 있습니까?
              앞으로 STEP 마다 계속 다시 그립니다. 지금 안 나누면 뒤에서 고생합니다.

       재료만 - fetch, map, join, toLocaleString

       ------------------------------------------------------------
       STEP 2 - (함정) 담아서 저장하기
       ------------------------------------------------------------
       · 담기를 누르면 그 상품이 장바구니에 들어가고, #cart 에 한 줄로 보이게 하세요.

    * {

      padding: 16px;

      background: #111;

      display: block;
      margin: 12px 0;
    }

    button {
      cursor: pointer;
      padding: 6px 12px;
      margin-right: 6px;
    }

    p {
      min-height: 24px;
    }

    #note {
      color: #8cf;
    }
  </style>
</head>

  <canvas id="canvas" width="520" height="320"></canvas>

  <button id="start">시작</button>
  <button id="stop">정지</button>
  <button id="reset">처음부터</button>
  <p id="note">
  <p id="rAF"></p>
  <p id="interval"></p>
  </p>
</body>

  // ============ 10 - 애니메이션 ============
  const ctx = canvas.getContext('2d')

     // ------------------------------------------------------------
     //  STEP 1 - 루프가 도는지 확인
     //  ------------------------------------------------------------
     //  공도 그림도 아직 아닙니다. requestAnimationFrame 이 진짜로 계속
     //  불리는지만 눈으로 봅니다.
   
     //  · 프레임을 셀 변수를 하나 두고, 루프에서 1 씩 올려 #note 에 찍으세요.

     //           답: 100 ? 새기가 좀 어려움 계속 올라감.
     //  확인 2 : 다른 탭으로 5초쯤 갔다가 돌아오세요. 숫자가 300 쯤 늘었습니까?
     //           예상: 300 그 이상 계속 숫자가 실제로 올라갈거같음.
     //           실제: 숫자가 계속 늘어남.
     let count = 0
     function loop(t) {
       count++
       $("#note").textContent = count
       requestAnimationFrame(loop)
     }
     loop()
      // ------------------------------------------------------------
      //    STEP 2 - setInterval 과 비교
      //    ------------------------------------------------------------
      //    · 같은 일을 하는 setInterval 버전을 하나 더 만들어 두 숫자를 나란히 찍으세요.
      //      (#note 에 "rAF: 123  interval: 456" 처럼)
      //    · 다른 탭으로 5초 갔다 오세요.

      //      예상 (두 숫자가 어떻게 벌어질까요): interval 이 느릴거같음.
      //      실제: 놀랍게도 interval 이 더 빨랐음.

      //    · 확인했으면 setInterval 쪽은 멈추고 지우세요. 아래에서 안 씁니다.

      let test = 0
      function loop(t) {
        count++
        $("#rAF").textContent = count
        requestAnimationFrame(loop)
      }
      loop()
      function interval() {
        setInterval(()=>$("#interval").textContent = test++)
      }
      interval()

        y: h / 2,
        r: w / 4,

        ctx.beginPath()
        ctx.fillStyle=color
        ctx.arc(x,y, r, 0, Math.PI * 2)
        ctx.fill()
        ctx.closePath()
      }

     STEP 5 - (함정) clearRect 를 빼면

     · 루프에서 clearRect 를 빼고 돌려보세요.

       예상: 계속 지우고 나서 그려서 할태니까.... 공이 옆으로 움직이는거처럼 보일거같음.

      //           dt 가 첫 프레임에 이상한 값이면 그것도 처리하세요.

        x: w / 2,
        y: h / 2,
        r: w / 4,
        vx: 120,
        color: `hsl(${Math.random() * 360},60%,70%)`,
      }
      function circle(x, y, r, color) {
        ctx.beginPath()
        ctx.fillStyle = color
        ctx.arc(x, y, r, 0, Math.PI * 2)
        ctx.fill()
        ctx.closePath()
      }
      let prev = 0
      let count = 0
      function loop(now) {
        const dt = (now - prev) / 1000
        prev = now
        ctx.clearRect(0, 0, w, h)
        circle
          (
            ball.x += ball.vx * dt,
            ball.y, ball.r,
            ball.color)
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)

     재료만 - cancelAnimationFrame
 function randomInt(max, min) {
    return Math.floor(Math.random() * (max - min)) + min
  }
  let b = {
    x: w / 2,
    y: h / 2,
    r: 50,
    vx: randomInt(120, -120),
    vy: randomInt(120, -120),
    color: `hsl(${Math.random() * 360},60%,70%)`,
  }

  function circle(x, y, r, color) {
    ctx.beginPath()
    ctx.fillStyle = color
    ctx.arc(x, y, r, 0, Math.PI * 2)
    ctx.fill()
    ctx.closePath()
  }
  let prev = 0
  let count = 0
  let rafId = null
  function loop(now) {
    const dt = (now - prev) / 1000
    prev = now
    ctx.clearRect(0, 0, w, h)
    b.x += b.vx * dt
    b.y += b.vy * dt
    if (b.x + b.r >= w || b.x - b.r <= 0) {
      b.vx *= -1
      b.x = Math.max(b.r, Math.min(w - b.r, b.x))
      b.color = `hsl(${Math.random() * 360},60%,70%)`
    }
    if (b.y + b.r >= h || b.y - b.r <= 0) {
      b.vy *= -1
      b.y = Math.max(b.r, Math.min(h - b.r, b.y))
      b.color = `hsl(${Math.random() * 360},60%,70%)`
    }
    circle(b.x, b.y, b.r, b.color)
    rafId = requestAnimationFrame(loop)
  }
  $("#start").onclick = () => {
    if (rafId !== null) return
    rafId = requestAnimationFrame(loop)
  }
  $("#stop").onclick = () => {
    cancelAnimationFrame(rafId)
    rafId = null
  }
  $("#reset").onclick = () => {
    cancelAnimationFrame(rafId)
    rafId = null
    b.x = w / 2
    b.y = h / 2
    ctx.clearRect(0, 0, w, h)
    circle(b.x, b.y, b.r, b.color)
  }

     STEP 9 - 공 여러 개
     ------------------------------------------------------------
     · 공을 10개로 늘리세요. 위치, 속도, 크기, 색이 제각각이어야 합니다.
     · 10개를 손으로 적지 말고 코드로 만드세요.

     확인 : 100 으로 바꿔도 코드를 거의 안 고치고 돌아가야 합니다.
            숫자 하나만 바꿔서 되면 통과입니다.
      
  function randomInt(max, min) {
    return Math.floor(Math.random() * (max - min)) + min
  }

  let ballCount = 10

  function createBalls() {
    return Array.from({ length: ballCount }, () => {
      let r = randomInt(50, 10)
      return {
        x: randomInt(w - r, r),
        y: randomInt(h - r, r),
        r,
        vx: randomInt(120, -120),
        vy: randomInt(120, -120),
        color: `hsl(${Math.random() * 360},60%,70%)`
      }
    })
  }

  let balls = createBalls()

  function circle(x, y, r, color) {
    ctx.beginPath()
    ctx.fillStyle = color
    ctx.arc(x, y, r, 0, Math.PI * 2)
    ctx.fill()
    ctx.closePath()
  }

  let prev = null
  let rafId = null

  function loop(now) {
    const dt = prev === null ? 0 : (now - prev) / 1000
    prev = now

    ctx.clearRect(0, 0, w, h)

    balls.forEach(b => {
      b.x += b.vx * dt
      b.y += b.vy * dt

      if (b.x + b.r >= w || b.x - b.r <= 0) {
        b.vx *= -1
        b.x = Math.max(b.r, Math.min(w - b.r, b.x))
        b.color = `hsl(${Math.random() * 360},60%,70%)`
      }

      if (b.y + b.r >= h || b.y - b.r <= 0) {
        b.vy *= -1
        b.y = Math.max(b.r, Math.min(h - b.r, b.y))
        b.color = `hsl(${Math.random() * 360},60%,70%)`
      }

      circle(b.x, b.y, b.r, b.color)
    })

    rafId = requestAnimationFrame(loop)
  }

  $("#start").onclick = () => {
    if (rafId !== null) return
    prev = null
    rafId = requestAnimationFrame(loop)
  }

  $("#stop").onclick = () => {
    cancelAnimationFrame(rafId)
    rafId = null
  }

  $("#reset").onclick = () => {
    cancelAnimationFrame(rafId)
    rafId = null
    balls = createBalls()
    prev = null
    ctx.clearRect(0, 0, w, h)
    balls.forEach(b => circle(b.x, b.y, b.r, b.color))
  }

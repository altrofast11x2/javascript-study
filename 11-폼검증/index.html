<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 - 폼 검증</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
    }

    form {
      max-width: 440px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #aaa;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      background: #111;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8cf;
    }

    .err {
      color: #f66;
      font-size: 12px;
      min-height: 16px;
      margin-top: 3px;
    }

    .invalid {
      border-color: #f66;
    }

    /* 라디오 묶음은 테두리가 없는 div 라서 border-color 만으로는 안 보인다 */
    .group.invalid {
      outline: 1px solid #f66;
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* 진행 중 안내 - 빨강도 초록도 아닌 회색 */
    .err.info {
      color: #aaa;
    }

    .ok {
      color: #6d6;
    }

    .group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .group label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #eee;
      margin: 0;
      font-size: 14px;
    }

    .group input {
      width: auto;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .row input {
      flex: 1;
    }

    .half {
      display: flex;
      gap: 10px;
    }

    .half>div {
      flex: 1;
    }

    .count {
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-top: 2px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      background: #333;
      color: #eee;
      border: 1px solid #666;
      border-radius: 4px;
    }

    button:hover {
      background: #444;
    }

    form>button {
      margin-top: 10px;
      margin-right: 6px;
    }

    #out {
      background: #111;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 13px;
      color: #8cf;
      min-height: 40px;
      max-width: 440px;
    }
  </style>
</head>

<body>
  <h1>장비 대여 신청</h1>

  <form id="f" novalidate>
    <div class="field">
      <label for="who">신청자 이름</label>
      <input type="text" id="who" name="who" placeholder="홍길동" required>
      <p class="err" data-for="who"></p>
    </div>

    <div class="field">
      <label for="tel">연락처</label>
      <input type="text" id="tel" name="tel" placeholder="010-0000-0000" maxlength="13" required>
      <p class="err" data-for="tel"></p>
    </div>

    <div class="half">
      <div class="field">
        <label for="item">대여 품목</label>
        <select id="item" name="item" required>
          <option value="">선택하세요</option>
          <option value="laptop">노트북</option>
          <option value="monitor">모니터</option>
          <option value="tablet">태블릿</option>
          <option value="keyboard">키보드</option>
        </select>
        <p class="err" data-for="item"></p>
      </div>

      <div class="field">
        <label for="qty">수량</label>
        <input type="number" id="qty" name="qty" placeholder="1" min="1" step="1" required>
        <p class="err" data-for="qty"></p>
      </div>
    </div>

    <div class="half">
      <div class="field">
        <label for="start">대여일</label>
        <input type="date" id="start" name="start" required>
        <p class="err" data-for="start"></p>
      </div>

      <div class="field">
        <label for="end">반납일</label>
        <input type="date" id="end" name="end" required>
        <p class="err" data-for="end"></p>
      </div>
    </div>

    <div class="field">
      <label>결제 방법</label>
      <div class="group">
        <label><input type="radio" name="pay" value="card" required> 카드</label>
        <label><input type="radio" name="pay" value="bank" required> 계좌이체</label>
      </div>
      <p class="err" data-for="pay"></p>
    </div>

    <div class="field">
      <label for="payer">입금자명</label>
      <input type="text" id="payer" name="payer" placeholder="계좌이체일 때만" disabled required>
      <p class="err" data-for="payer"></p>
    </div>

    <div class="field">
      <label for="coupon">쿠폰 코드</label>
      <div class="row">
        <input type="text" id="coupon" name="coupon" placeholder="없으면 비워두세요">
        <button type="button" id="check">쿠폰확인</button>
      </div>
      <p class="err" data-for="coupon"></p>
    </div>

    <div class="field">
      <label for="memo">요청 사항</label>
      <textarea id="memo" name="memo" placeholder="없으면 비워두세요"></textarea>
      <p class="count" id="memo-count"></p>
      <p class="err" data-for="memo"></p>
    </div>

    <div class="field">
      <div class="group">
        <label><input type="checkbox" id="agree" name="agree" required> 대여 규정에 동의합니다</label>
      </div>
      <p class="err" data-for="agree"></p>
    </div>

    <button type="submit" id="send">신청하기</button>
    <button type="button" id="fill">예시값 채우기</button>
    <button type="button" id="clear">다 지우기</button>
  </form>

  <div id="out"></div>

  <script src="../lib.js"></script>
  <script>
    // ============ 11 - 폼 검증 : 장비 대여 신청 ============

    // ---------- 화면 요소 ----------
    const form = $("#f")
    const pay = form.elements.pay        // RadioNodeList : 값은 읽히지만 이벤트는 못 받는다
    const fill = $("#fill")
    const clear = $("#clear")
    const check = $("#check")
    const memoCount = $("#memo-count")
    const out = $("#out")

    // 이름 있는 칸만 모은다. 라디오는 위 pay 로 따로 다루므로 뺀다
    const field = Object.fromEntries(
      [...form.elements].filter(e => e.name && e.name !== "pay").map(e => [e.name, e])
    )
    const { who, tel, item, qty, start, end, payer, coupon, memo, agree } = field

    // ---------- 오늘 날짜 ----------
    // input[type=date].value 와 같은 YYYY-MM-DD 꼴이라 문자열끼리 비교해도 순서가 맞는다
    const now = new Date()
    const today = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, "0"),
      String(now.getDate()).padStart(2, "0")
    ].join("-")

    // ---------- 규칙 표 ----------
    // 품목별 수량 상한. if / else if 를 늘리지 않기 위해 품목 코드를 키로 쓴다
    const limits = { laptop: 1, monitor: 2, tablet: 3, keyboard: 5 }

    // 짝지어 판정하는 칸. 왼쪽이 바뀌면 오른쪽 판정도 달라진다
    const partner = { start: "end", item: "qty", pay: "payer" }

    // 칸 이름 -> 결과에 찍을 이름
    const labels = {
      who: "신청자", tel: "연락처", item: "품목", qty: "수량",
      start: "대여일", end: "반납일", pay: "결제방법", payer: "입금자명",
      coupon: "쿠폰", memo: "요청사항", agree: "동의"
    }

    // ---------- 쿠폰 확인 상태 ----------
    // 참/거짓이 아니라 "확인한 값" 을 담아둔다. 확인 뒤에 코드를 고치면 값이 어긋나 막힌다
    let checkedCoupon = null
    let checking = false                 // 확인 중에는 다시 요청하지 않는다

    // ---------- 검증 : 값 -> 메시지 ----------
    // 이 안에서는 document / $ 를 쓰지 않는다. 화면은 say() 가 혼자 만진다
    const rules = {
      who: e => !e.value ? "이름을 입력하세요."
        : /^[가-힣]{2,5}$/.test(e.value) ? "" : "이름을 한글 2~5자로 입력하세요.",

      tel: e => !e.value ? "연락처를 입력하세요."
        : /^010-\d{4}-\d{4}$/.test(e.value) ? "" : "010-0000-0000 형식으로 입력하세요.",

      item: e => e.value ? "" : "품목을 선택하세요.",

      qty: e => !e.value ? "수량을 입력하세요."
        : !/^\d+$/.test(e.value) || +e.value < 1 ? "1 이상의 정수를 입력하세요."
        : !item.value ? "품목을 먼저 선택하세요."
        : +e.value > limits[item.value]
          ? `${item.selectedOptions[0].text}는 최대 ${limits[item.value]}개까지 대여할 수 있습니다.`
          : "",

      start: e => !e.value ? "대여일을 선택하세요."
        : e.value < today ? "대여일은 오늘 이후로 선택하세요." : "",

      // 반납일은 대여일을 봐야 한다
      end: e => {
        if (!e.value) return "반납일을 선택하세요."
        if (!start.value) return "대여일을 먼저 선택하세요."
        const days = (Date.parse(e.value) - Date.parse(start.value)) / 86400000
        if (days <= 0) return "반납일은 대여일보다 뒤여야 합니다."
        if (days > 7) return "대여 기간은 최대 7일입니다."
        return ""
      },

      pay: e => e.value ? "" : "결제 방법을 선택하세요.",

      // 계좌이체일 때만 필수. 카드면 비어 있어도 통과
      payer: e => pay.value !== "bank" ? ""
        : !e.value ? "입금자명을 입력하세요."
        : /^[가-힣]{2,5}$/.test(e.value) ? "" : "입금자명을 한글 2~5자로 입력하세요.",

      // 쿠폰은 선택 항목. 넣었으면 그 값으로 확인을 받아야 한다
      coupon: e => {
        const code = e.value.trim()
        if (!code) return ""
        if (!checkedCoupon || checkedCoupon.code !== code) return "쿠폰확인을 눌러주세요."
        return ""
      },

      memo: e => e.value.length > 100 ? `요청 사항은 100자까지 입력할 수 있습니다. (현재 ${e.value.length}자)` : "",

      agree: e => e.checked ? "" : "대여 규정에 동의해야 합니다."
    }

    // ---------- 화면 표시 : 여기만 DOM 을 만진다 ----------
    // kind : "bad" 빨강 / "ok" 초록 / "info" 회색
    function say(name, msg, kind = "bad") {
      const box = $(`[data-for="${name}"]`)
      const target = name === "pay" ? pay[0].closest(".group") : field[name]
      box.textContent = msg
      box.classList.toggle("ok", !!msg && kind === "ok")
      box.classList.toggle("info", !!msg && kind === "info")
      target.classList.toggle("invalid", !!msg && kind === "bad")
    }

    // ---------- 한 칸 검사하고 그리기 ----------
    // submit, blur, input 세 군데가 모두 이 함수를 부른다
    function checkField(name) {
      const msg = rules[name](name === "pay" ? pay : field[name])
      say(name, msg)
      return msg
    }

    // 에러 글씨가 떠 있는지
    function hasError(name) {
      return $(`[data-for="${name}"]`).textContent !== ""
    }

    // 짝지어진 칸을 같이 다시 검사한다.
    // 아직 비어 있고 조용한 짝은 건드리지 않는다 - 안 건드린 칸을 혼내면 안 되니까
    function checkPartner(name) {
      const mate = partner[name]
      if (!mate) return
      const el = field[mate]
      const filled = el.type === "checkbox" ? el.checked : el.value !== ""
      if (filled || hasError(mate)) checkField(mate)
      else say(mate, "")
    }

    // ---------- 결제 방법에 따라 입금자명 칸을 열고 닫는다 ----------
    function payerToggle() {
      payer.disabled = pay.value !== "bank"
      if (payer.disabled) payer.value = ""
    }

    // ---------- 입력하는 동안 값을 다듬는 칸 ----------
    const formatters = {
      // 숫자만 남기고 11자리까지만 받는다. maxlength 는 사람이 칠 때만 막아준다
      tel: el => {
        const n = el.value.replace(/\D/g, "").slice(0, 11)
        el.value = [n.slice(0, 3), n.slice(3, 7), n.slice(7)].filter(Boolean).join("-")
      },
      // 글자수는 칠 때마다 바뀌어야 한다 - input 이 맞는 자리
      memo: el => memoCount.textContent = `${el.value.length} / 100`
    }

    // ---------- 모든 칸 비우기 ----------
    function resetAll() {
      Object.keys(rules).forEach(name => say(name, ""))
      memoCount.textContent = "0 / 100"
      checkedCoupon = null
      out.textContent = ""
    }

    // ---------- 날짜 더하기 ----------
    function plusDays(ymd, n) {
      const d = new Date(ymd)
      d.setDate(d.getDate() + n)
      return d.toISOString().slice(0, 10)
    }

    // ---------- 신청 결과 만들기 ----------
    // FormData 는 체크 안 한 체크박스, 안 고른 라디오, disabled 인 칸을 아예 담지 않는다.
    // 그래서 빠질 수 있는 항목은 직접 채워 넣는다
    function result() {
      const fd = Object.fromEntries(new FormData(form))
      const data = {}
      Object.entries(labels).forEach(([name, label]) => {
        if (name === "agree") data[label] = agree.checked ? "동의" : "미동의"
        else if (name === "item") data[label] = item.selectedOptions[0].text
        else if (name === "pay") data[label] = pay.value === "bank" ? "계좌이체" : "카드"
        else if (name === "coupon") data[label] = checkedCoupon ? `${checkedCoupon.code} (${checkedCoupon.off}% 할인)` : "없음"
        else data[label] = fd[name] ?? ""
      })
      return data
    }

    // ============ 이벤트 등록 ============
    // 등록은 여기서 한 번만 한다. 함수 안에 넣으면 부를 때마다 핸들러가 쌓인다

    // blur : 그 칸만 / input : 한번 틀린 칸만 고치는 즉시 다시
    // 라디오는 RadioNodeList 가 이벤트를 못 받으므로 칸 하나하나에 걸어야 한다
    Object.keys(rules).forEach(name => {
      const targets = name === "pay" ? [...pay] : [field[name]]
      targets.forEach(el => {
        el.addEventListener("blur", () => checkField(name))
        el.addEventListener("input", () => {
          if (formatters[name]) formatters[name](el)
          if (hasError(name)) checkField(name)
        })
      })
    })

    // 값이 바뀌면 짝지어진 칸도 같이 본다
    form.addEventListener("change", e => {
      const name = e.target.name
      if (!name) return
      if (name === "pay") payerToggle()
      if (hasError(name)) checkField(name)
      checkPartner(name)
    })

    // 신청하기
    form.addEventListener("submit", e => {
      e.preventDefault()               // 판단보다 먼저 막는다. 아래에서 터져도 폼이 새지 않는다

      let first = null
      Object.keys(rules).forEach(name => {
        if (checkField(name) && !first) first = name === "pay" ? pay[0] : field[name]
      })

      if (first) {
        out.textContent = ""
        first.focus()
        return
      }

      out.textContent = JSON.stringify(result(), null, 2)
    })

    // 예시값 채우기 : 모든 규칙을 통과하는 값만 넣는다
    fill.addEventListener("click", () => {
      who.value = "홍길동"
      tel.value = "010-1234-5678"
      item.value = "keyboard"          // 상한 5개
      qty.value = 2
      start.value = today
      end.value = plusDays(today, 3)   // 대여일보다 뒤, 7일 이내
      pay[0].checked = true            // 카드 -> 입금자명은 비어도 통과
      payerToggle()
      coupon.value = ""                // 쿠폰은 선택 항목이고 확인을 안 했으므로 비워둔다
      memo.value = "회의실에서 사용합니다."
      agree.checked = true
      resetAll()
      memoCount.textContent = `${memo.value.length} / 100`
    })

    // 다 지우기 : reset 은 change 를 쏘지 않으므로 뒷정리를 직접 한다
    clear.addEventListener("click", () => {
      form.reset()
      payerToggle()
      resetAll()
    })

    // 쿠폰확인
    check.addEventListener("click", async () => {
      if (checking) return                      // 연타 막기
      const code = coupon.value.trim()          // 값은 여기서 한 번만 읽는다
      if (!code) return say("coupon", "쿠폰 코드를 입력하세요.")

      checking = true
      check.disabled = true
      say("coupon", "확인 중...", "info")

      try {
        await new Promise(r => setTimeout(r, 2000))      // 느린 서버 흉내
        const res = await fetch("./coupons.json")
        if (!res.ok) throw new Error(`쿠폰 정보를 불러올 수 없습니다. (${res.status})`)

        const data = await res.json()                    // 맨 바깥은 배열이 아니라 객체다
        const found = data.coupons.find(c => c.code === code)

        // 기다리는 동안 칸이 바뀌었으면 이 결과는 버린다
        if (coupon.value.trim() !== code) {
          checkedCoupon = null
          return say("coupon", "쿠폰 코드가 바뀌었습니다. 다시 확인해주세요.")
        }

        if (!found) {
          checkedCoupon = null
          say("coupon", "없는 쿠폰입니다.")
        } else if (found.until < today) {
          checkedCoupon = null
          say("coupon", "기간이 지난 쿠폰입니다.")
        } else {
          checkedCoupon = found                          // 확인한 값을 담아둔다
          say("coupon", `${found.off}% 할인이 적용됩니다.`, "ok")
        }
      } catch (err) {
        checkedCoupon = null
        say("coupon", err.message)                       // 사용자가 원인을 알 수 있게
      } finally {
        checking = false
        check.disabled = false
      }
    })

    // ============ 시작 상태 ============
    // min 은 값을 거부하지 않는다. 달력에서 고르기 어렵게만 해주고 판정은 rules 가 한다
    start.min = today
    end.min = today
    payerToggle()
    memoCount.textContent = "0 / 100"

    /* ============================================================
       2026년도 전국기능경기대회 (연습 과제)

         직 종 명    웹디자인 및 개발
         과 제 명    장비 대여 신청
         과제번호    C
         경기시간    2시간
         비 번 호
         심사위원 확인                                        (인)

       ------------------------------------------------------------
       개요
       ------------------------------------------------------------
       □ 과제 개요

         사내 장비 대여를 관리하는 총무팀으로부터 프리랜서인 당신은 신청
         폼 개발 의뢰를 받았다. 기존에는 종이 신청서를 받아 담당자가 일일이
         규정 위반을 확인하고 있었으며, 클라이언트는 신청 단계에서 규정을
         자동으로 확인하여 반려를 줄일 수 있는 폼 구축을 요청했다.
         선수는 제공된 요구사항 문서를 바탕으로 기능을 구현해야 한다.

       □ 과제 구성 및 경기시간

       ------------------------------------------------------------
       선수이행사항
       ------------------------------------------------------------
       ■ 공통사항

         선수는 HTML, CSS, JavaScript 를 활용하여 기능을 구현한다.

         브라우저가 제공하는 기본 검증 안내를 사용하지 않으며, 모든 안내
         메시지는 화면에 직접 표시한다.

         규칙을 어긴 칸은 data-for 가 일치하는 .err 에 사유를 표시하고,
         해당 칸에 invalid 클래스를 적용한다.

         규칙을 어긴 항목이 하나라도 있는 경우 폼은 전송되지 않으며,
         페이지가 새로고침되지 않는다.

         코드에는 유지 및 보수가 용이하도록 반드시 용도와 목적을 분명하게
         표시하여 주석(한글만 인정)을 작성하고, 코딩 스타일은 가독성이
         좋아야 한다.

         완성된 페이지는 Google Chrome 에서 정상적으로 작동한다.

       ------------------------------------------------------------
       기능구현
       ------------------------------------------------------------
       ■ 대여 신청 폼 – 입력 규칙

         신청자 이름은 한글 2~5자이어야 한다.

         연락처는 010-0000-0000 형식이어야 한다.

         대여 품목은 반드시 선택하여야 한다.

         수량은 1 이상의 정수이어야 하며, 품목별 상한을 초과할 수 없다.
         품목별 상한은 노트북 1개, 모니터 2개, 태블릿 3개, 키보드 5개이다.

         대여일은 오늘을 포함한 이후의 날짜이어야 한다.

         반납일은 대여일보다 뒤의 날짜이어야 하며, 대여일로부터 7일을
         초과할 수 없다.

         결제 방법은 카드 또는 계좌이체 중 하나를 선택하여야 한다.

         입금자명은 결제 방법이 계좌이체인 경우에만 필수이며 한글 2~5자
         이어야 한다. 카드인 경우 비어 있어도 통과한다.

         쿠폰 코드는 선택 항목이다. 입력한 경우 coupons.json 에 존재하고
         사용 기간이 남아 있어야 한다.

         요청 사항은 선택 항목이며, 입력한 경우 100자를 초과할 수 없다.

         대여 규정 동의는 반드시 체크하여야 한다.

       ■ 대여 신청 폼 – 검증 시점

         신청하기 버튼을 클릭하면 모든 입력 칸을 검증하고, 어긴 항목이
         있는 경우 첫 번째 오류 칸으로 포커스를 이동한다.

         아직 입력하지 않은 칸에는 오류가 표시되지 않는다.

         입력 칸에서 포커스가 벗어나면 해당 칸을 검증한다.

         오류가 표시된 칸은 입력을 수정하는 즉시 오류 표시가 해제된다.

         결제 방법 라디오도 다른 입력 칸과 동일한 시점에 검증된다.

       ■ 대여 신청 폼 – 판정 연동

         결제 방법을 변경하면 입금자명의 판정이 함께 갱신된다.

         대여일을 변경하면 반납일의 판정이 함께 갱신된다.

         대여 품목을 변경하면 수량의 판정이 함께 갱신된다.

         위 세 가지는 신청하기 버튼을 클릭하기 전에 화면에 반영된다.

       ■ 대여 신청 폼 – 보조 버튼

         예시값 채우기 버튼을 클릭하면 모든 칸에 입력 규칙을 통과하는
         값이 입력된다.

         다 지우기 버튼을 클릭하면 모든 칸의 값과 오류 표시가 초기화된다.

         예시값 채우기 버튼과 다 지우기 버튼은 폼을 전송하지 않는다.

         요청 사항의 글자수는 "0 / 100" 형식으로 #memo-count 에 표시되며,
         입력할 때마다 갱신된다.

       ■ 대여 신청 폼 – 쿠폰 확인

         쿠폰 코드 칸 옆에 쿠폰확인 버튼을 추가한다. 이 버튼은 폼을
         전송하지 않는다.

         쿠폰확인 버튼을 클릭하면 coupons.json 을 읽어 결과를 표시한다.
           존재하지 않는 코드    "없는 쿠폰입니다"
           사용 기간이 지난 코드  "기간이 지난 쿠폰입니다"
           사용 가능한 코드      ok 클래스를 적용하여
                               "○○% 할인이 적용됩니다"
                               (○○ 는 해당 쿠폰의 off 값이다)

         쿠폰 데이터를 읽는 동안 "확인 중..." 을 표시한다.

         느린 응답 상황을 재현할 수 있도록 쿠폰 데이터를 읽기 전에 2초의
         지연을 둔다.

         확인을 거치지 않은 쿠폰 코드가 입력되어 있는 경우 신청은
         전송되지 않는다.

         확인을 완료한 뒤 쿠폰 코드를 수정한 경우, 수정된 코드로 다시
         확인하지 않으면 신청은 전송되지 않는다.

         쿠폰 데이터를 읽을 수 없는 경우 사용자가 원인을 알 수 있도록
         안내 메시지를 표시한다.

         쿠폰확인이 진행되는 동안에는 버튼이 다시 클릭되지 않으며,
         연속하여 클릭해도 요청은 한 번만 발생한다.

       ■ 대여 신청 폼 – 신청 결과

         모든 입력 규칙을 통과한 경우 폼에 입력된 값이 항목명과 함께
         #out 에 줄바꿈이 적용된 형태로 표시된다.

         서버가 제공되지 않으므로 전송하지 않고 #out 표시로 대신한다.

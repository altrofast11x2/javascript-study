<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 - 폼 검증</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #222;
      color: #eee;
      font-family: sans-serif;
      padding: 20px;
    }

    form {
      max-width: 440px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #aaa;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      background: #111;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8cf;
    }

    .err {
      color: #f66;
      font-size: 12px;
      min-height: 16px;
      margin-top: 3px;
    }

    .invalid {
      border-color: #f66;
    }

    .ok {
      color: #6d6;
    }

    .group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .group label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #eee;
      margin: 0;
      font-size: 14px;
    }

    .group input {
      width: auto;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .row input {
      flex: 1;
    }

    .half {
      display: flex;
      gap: 10px;
    }

    .half>div {
      flex: 1;
    }

    .count {
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-top: 2px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      background: #333;
      color: #eee;
      border: 1px solid #666;
      border-radius: 4px;
    }

    button:hover {
      background: #444;
    }

    form>button {
      margin-top: 10px;
      margin-right: 6px;
    }

    #out {
      background: #111;
      border: 1px solid #555;
      padding: 10px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 13px;
      color: #8cf;
      min-height: 40px;
      max-width: 440px;
    }
  </style>
</head>

<body>
  <h1>장비 대여 신청</h1>

  <form id="f" novalidate>
    <div class="field">
      <label for="who">신청자 이름</label>
      <input type="text" id="who" name="who" placeholder="홍길동" required>
      <p class="err" data-for="who"></p>
    </div>

    <div class="field">
      <label for="tel">연락처</label>
      <input type="text" id="tel" name="tel" placeholder="010-0000-0000" maxlength="13" required>
      <p class="err" data-for="tel"></p>
    </div>

    <div class="half">
      <div class="field">
        <label for="item">대여 품목</label>
        <select id="item" name="item">
          <option value="">선택하세요</option>
          <option value="laptop">노트북</option>
          <option value="monitor">모니터</option>
          <option value="tablet">태블릿</option>
          <option value="keyboard">키보드</option>
        </select>
        <p class="err" data-for="item"></p>
      </div>

      <div class="field">
        <label for="qty">수량</label>
        <input type="number" id="qty" name="qty" placeholder="1" required>
        <p class="err" data-for="qty"></p>
      </div>
    </div>

    <div class="half">
      <div class="field">
        <label for="start">대여일</label>
        <input type="date" id="start" name="start">
        <p class="err" data-for="start"></p>
      </div>

      <div class="field">
        <label for="end">반납일</label>
        <input type="date" id="end" name="end">
        <p class="err" data-for="end"></p>
      </div>
    </div>

    <div class="field">
      <label>결제 방법</label>
      <div class="group">
        <label><input type="radio" name="pay" value="card"> 카드</label>
        <label><input type="radio" name="pay" value="bank"> 계좌이체</label>
      </div>
      <p class="err" data-for="pay"></p>
    </div>

    <div class="field">
      <label for="payer">입금자명</label>
      <input type="text" id="payer" name="payer" placeholder="계좌이체일 때만" disabled required>
      <p class="err" data-for="payer"></p>
    </div>

    <div class="field">
      <label for="coupon">쿠폰 코드</label>
      <input type="text" id="coupon" name="coupon" placeholder="없으면 비워두세요" required>
      <p class="err" data-for="coupon"></p>
    </div>

    <div class="field">
      <label for="memo">요청 사항</label>
      <textarea id="memo" name="memo" placeholder="없으면 비워두세요"></textarea>
      <p class="count" id="memo-count">0 / 100</p>
      <p class="err" data-for="memo"></p>
    </div>

    <div class="field">
      <div class="group">
        <label><input type="checkbox" id="agree" name="agree"> 대여 규정에 동의합니다</label>
      </div>
      <p class="err" data-for="agree"></p>
    </div>

    <button type="submit" id="send">신청하기</button>
    <button type="button" id="fill">예시값 채우기</button>
    <button type="button" id="clear">다 지우기</button>
  </form>

  <div id="out"></div>

  <script src="../lib.js"></script>
  <script>
    // ============ 11 - 폼 검증 ============
    const form = $("#f")
    const pay = form.elements.pay
    const fill = $("#fill")
    const clear = $("#clear")
    const send = $("#send")
    const memo_count = $("#memo-count")
    const field = Object.fromEntries([...form.elements].filter(e => e.name && e.name !== 'pay').map(e => [e.name, e]))
    const { who, tel, item, qty, start, end, payer, coupon, memo, agree } = field
    console.log(field);
    // date
    const today = new Date()
    const date = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, '0'),
      String(today.getDate()).padStart(2, '0')
    ].join('-')
    // functions
    function payerToggle() {
      payer.disabled = pay.value !== 'bank'
      if (payer.disabled) payer.value = ""
    }
    form.onchange = (e) => {
      if (e.target.name === 'pay') {
        payerToggle()
        if ($(`[data-for='payer']`).textContent) {
          showError('payer', rules.payer(payer))
        }
        if (e.target.name === 'start' && end.value) {
          showError('end', rules.end(end))
        }

        if (e.target.name === 'item' && qty.value) {
          showError('qty', rules.payer(qty))
        }
      }
    }
    function showError(name, msg) {
      const input = $(`#${name}`)
      const err = $(`[data-for="${name}"]`)
      const target = name === 'pay' ? pay[0].closest('.group') : input
      err.textContent = msg
      target.classList.toggle('invalid', !!msg)
    }
    // fill
    fill.onclick = () => {
      who.value = "홍길동"
      tel.value = "010-1234-5678"
      item.value = "laptop"
      qty.value = 100
      start.value = date
      pay.value = "card"
      payerToggle()
      end.value = date
      coupon.value = "ABCD-EFGH-IJKL"
      memo.value = "Hello World!"
      agree.checked = true
    }
    // clear
    clear.onclick = () => {
      form.reset();
      payerToggle();
      Object.keys(rules).forEach(name => showError(name, ''))
    }
    // tel
    tel.oninput = () => {
      tel.value = tel.value
        .replace(/[^0-9]/g, "")
        .replace(/(\d{3})(\d{0,4})(\d{0,4})/, (_, f, s, t) => [f, s, t].filter(Boolean).join('-'));
    }
    // rule
    const rules = {
      who: e => !e.value ? "이름을 입력하세요." : /^[가-힣]{2,5}$/.test(e.value) ? "" : "이름을 한글 2~5자 입력하세요.",
      tel: e => !e.value ? "연락처를 입력하세요." : /^010-\d{4}-\d{4}$/.test(e.value) ? '' : "010-0000-0000 형식으로 입력하세요.",
      item: e =>{
                
      },
      qty: e => !e.value
        ? "수량을 선택하세요." && Number.isInteger(+e.value) && +e.value >= 1 : "",
      start: e => !e.value ? "대여일을 선택하세요." : e.value < today ? "대여일은 오늘 이후로 선택하세요." : "",
      pay: e => e.value ? "" : "결제 방법을 선택하세요.",
      end: e => {
        if (!e.value) return "반납일을 선택하세요."
        if (!start.value) return "먼저 대여일을 선택하세요."
        const diff = (Date.parse(e.value) - Date.parse(start.value) / 846400000)
        console.log(Date.parse(e.value));
        return diff <= 20
          ? "반납일은 대여일보다 뒤여야 합니다." : diff > 7
            ? "대여 기간은 최대 7일입니다." : ""
      },
      payer: e => pay.value !== 'bank' ? "" : !e.value ? "입금자명을 입력하세요." : /^[가-힣]{2,5}$/.test(e.value) ? "" : "입금자명은 한글 2~5자로 입력하세요.",
      coupon: e => "",
      memo: e => (e.value.length > 100) ? "최대 글자입니다." : "",
      agree: e => !e.checked ? "대여 규정에 동의해야합니다." : "",
    }
    // form
    form.onsubmit = e => {
      e.preventDefault()
      let firstError = null
      Object.entries(rules).forEach(([name, v]) => {
        const input = name === 'pay' ? pay : field[name]
        const msg = v(input)
        showError(name, msg)
        if (msg && !firstError) {
          firstError = name === 'pay' ? pay[0] : input
        }
      })
      if (firstError) {
        firstError.focus()
        return
      }
      console.log('신청완료');
    }
    // step 7
    Object.entries(rules).forEach(([name, v]) => {
      const input = name === 'pay' ? pay : field[name]
      input.onblur = () => {
        showError(name, rules[name](input))
      }
    });
    memo.oninput = () => {
      const max = 100
      memo_count.textContent = `${memo.value.length} / ${String(max)}`
    }
    // step 8
    /* ============================================================
       미션 : 장비 대여 신청 폼 검증

       화면 요소   폼 #f
                   버튼    #send(신청하기) #fill(예시값) #clear(다 지우기)
                   칸      #who #tel #item #qty #start #end #payer #coupon #memo #agree
                           name="pay" 라디오 2개 (card / bank)
                   에러칸  <p class="err" data-for="칸이름">   10개 다 있습니다
                   글자수  #memo-count   (비어 있습니다)
                   결과    #out
                   CSS     .invalid(빨간 테두리) .ok(초록 글씨)  이미 있습니다
       데이터      coupons.json   (쓸 수 있는 쿠폰 목록)

       검증 속성(required / pattern / type / min / max / maxlength)은
       일부러 하나도 안 붙여놨습니다. STEP 1 에서 직접 붙입니다.

       STEP 하나씩 하고 보여주세요. 한 번에 다 하면 어디서 틀렸는지 못 찾습니다.
       끝낸 STEP 은 주석으로 바꿔서 아래에 쌓아두세요.

       ------------------------------------------------------------
       [ 질문권 3장 ]
       ------------------------------------------------------------
       이 강의에서 클로드에게 쓸 수 있는 질문은 3번입니다. (노벨 님이 정한 규칙)

         · 내 답에 코드가 한 줄이라도 나오면       1장
         · 코드 없이 "어디를 찾아봐라" 만 들어도   1장
         · 다 끝내고 "체점해줘"                   0장

         1장 :
         2장 :
         3장 :

       3장 다 쓰고도 막히면 그 자리에서 멈추고 못 한 채로 보여주세요.
       빈칸이 남은 게 "AI 가 채워준 만점" 보다 낫습니다. 대회장에는 내가 없습니다.

       ------------------------------------------------------------
       [ 대여 규칙 ]  - 검증할 내용은 전부 여기 있습니다
       ------------------------------------------------------------
         who     한글 2~5자
         tel     010-0000-0000 꼴
         item    골라야 함
         qty     1 이상의 정수, 그런데 품목마다 상한이 다릅니다
                   노트북 1 / 모니터 2 / 태블릿 3 / 키보드 5
         start   오늘 이후 (오늘 포함)
         end     start 보다 뒤, 그리고 start 로부터 최대 7일
         pay     카드 또는 계좌이체 중 하나를 골라야 함
         payer   pay 가 계좌이체일 때만 필수. 한글 2~5자
                 카드면 비어 있어도 됩니다
         coupon  비워도 됩니다. 넣었으면 coupons.json 에 있고 기간도 남아 있어야 함
         memo    비워도 됩니다. 넣었으면 100자 이하
         agree   체크해야 함

       ------------------------------------------------------------
       STEP 1 - JS 없이, HTML 속성만
       ------------------------------------------------------------
       JS 는 아직 한 줄도 쓰지 않습니다. HTML 속성만 붙입니다.
       위 규칙 중에서 HTML 속성만으로 되는 것을 골라 붙이세요.

       확인 1 : 아무것도 안 넣고 신청하기를 누르세요. 말풍선이 몇 개 뜹니까?
                답: 안뜸.
       확인 2 : 대여일에 과거 날짜를 막는 속성을 붙였습니까? 붙였다면,
                날짜 칸에 키보드로 2020-01-01 을 쳐넣을 수 있습니까?
                답:못 넣음.
       확인 3 : qty 를 type="number" 로 바꾸면 "3.5" 를 막을 수 있습니까?
                답:막음. step을 넣으면 달라지지만..

       ------------------------------------------------------------
       STEP 2 - (함정) 라디오 버튼
       ------------------------------------------------------------
       · 결제 방법 라디오 둘 중 하나에만 required 를 붙이세요.
       · 아무것도 안 고르고 신청하기를 누르세요.

         예상: 말풍선이뜸.
         실제: 말풍선이뜸.
         왜 그런지: required 했으니까?

       · 이번엔 둘 다에 required 를 붙이고 다시 해보세요. 뭐가 달라집니까?
         답: 둘중하나만 체크해도됨.

       ------------------------------------------------------------
       STEP 3 - (함정) 버튼이 세 개입니다
       ------------------------------------------------------------
       · #fill 을 누르면 모든 칸에 예시값이 들어가게,
         #clear 를 누르면 모든 칸이 비워지게 만드세요.

       · 만들고 나서 #fill 을 눌러보세요.

         예상: 버튼에 type 이 없어서 submit 으로 처리됨. 하지만 나는 작동하죠? ㅋ
         실제: 버튼에 type 이 없어서 submit 으로 처리됨. 하지만 나는 작동하죠? ㅋ
         왜 그런지: 버튼에 type 이 없어서 submit 으로 처리됨. 하지만 나는 작동하죠? ㅋ

       · 고치세요. HTML 한 속성입니다.

       · #clear 는 폼을 비우는 기본 기능이 이미 브라우저에 있습니다.
         그걸 쓰면 속성 하나로 끝납니다. 찾아보세요.
         답: reset()

       ------------------------------------------------------------
       STEP 4 - 운전대를 내가 잡는다
       ------------------------------------------------------------
       · 폼에 novalidate 를 붙이세요.
       · submit 을 가로채서 새로고침을 막고, 일단 console.log 만 찍으세요.

       확인 : 빈 폼으로 신청하기를 눌렀을 때
              (1) 말풍선이 안 뜨고  (2) 새로고침이 안 되고  (3) 로그가 찍히면 통과.

       확인 : 쿠폰 칸에 커서를 두고 Enter 를 눌러보세요. 같은 로그가 찍힙니까?
              답:

       ------------------------------------------------------------
       STEP 5 - 검증 함수 하나 + 에러 표시
       ------------------------------------------------------------
       연락처 칸만 먼저 합니다.

       · 연락처를 검사하는 함수를 만드세요.
         - 비었으면           "연락처를 입력하세요"
         - 010-0000-0000 꼴이 아니면  "010-0000-0000 형식으로 입력하세요"
         - 문제 없으면        빈 문자열

       · 메시지를 화면에 쓰는 함수를 따로 만드세요.
         - data-for 가 맞는 .err 에 메시지를 넣고
         - 칸에 invalid 클래스를 켜거나 끕니다

       확인 : 검사하는 함수 안에 document / $ 가 한 개도 없어야 합니다.
              있으면 역할이 섞인 겁니다.

       재료만 - classList.toggle 의 두번째 인자, [data-for=...] 선택자

       ------------------------------------------------------------
       STEP 6 - 전부로 늘리기
       ------------------------------------------------------------
       · 칸 이름을 키로 하는 객체 하나에 검증을 모으세요.
       · submit 때 전부 검사하고, 하나라도 에러면 보내지 않습니다.
       · 첫번째 에러 칸으로 focus 를 보내세요.

       · qty, payer, coupon 은 다른 칸을 봐야 합니다. 지금은 비었는지만 보고
         STEP 8, 9, 11 에서 제대로 하세요.

       확인 : 칸을 하나 더 추가한다고 상상해보세요.
              객체에 한 줄만 쓰면 되게 되어 있습니까?
              답:

       ------------------------------------------------------------
       STEP 7 - (함정) 언제 검사할까
       ------------------------------------------------------------
       · 먼저 모든 칸에 input 이벤트로 검사를 다세요. (일부러)
       · 이름 칸에 "노" 한 글자만 쳐보세요.

         예상: 경고뜨지
         실제 느낌: 경고가뜸.

       · 이제 이렇게 바꾸세요.
         1) submit 때 전부
         2) blur 때 그 칸만
         3) 한번 에러가 난 칸은 그 뒤로 input 때마다

       확인 : 아직 안 건드린 칸은 조용하고, 한번 틀린 칸은 고치는 즉시
              빨간불이 꺼져야 합니다.

       · 그런데 #memo-count 의 글자수는 input 때마다 바뀌어야 합니다.
         "0 / 100" 처럼 보여주세요.
         input 이 성가신 경우와 input 이 맞는 경우가 같은 화면에 있습니다.

       확인 : memo 에 한글을 칠 때, 자음만 친 상태("ㄱ")에서도 숫자가 올라갑니까?
              답: 네

       ------------------------------------------------------------
       STEP 8 - (함정) 라디오가 다른 칸의 필수 여부를 바꿉니다
